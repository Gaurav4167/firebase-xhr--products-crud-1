<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="./assets/css/style.css">

    <title>Proucts CRUD-1</title>
</head>

<body>

    <div class="container">
        <div class="row">

            <div class="col-8 offset-2 mt-3">
                <h3 class="bg-light"> <b>*</b> Product Data Management <b>*</b></h3>
            </div>

            <div class="col-8 offset-2">
                <div class="card">
                    <div class="card-body">
                        <form id="form">

                            <label class="mt-3" for="pName"> <b>Name <span class="text-danger"> * </span></b> </label>
                            <input id="pName" type="text" class="form-control" required placeholder="e.g Laptop">

                            <label class="mt-3" for="pType"> <b>Type <span class="text-danger"> *</span> </b></label>
                            <input id="pType" type="text" class="form-control" required placeholder="e.g Electronics">

                            <label class="mt-3" for="stock"> <b>Stock<span class="text-danger"> *</span> </b></label>
                            <input id="stock" type="text" class="form-control" required placeholder="Available">

                            <button id="addBtn" class="btn btn-primary btn-block mt-3" type="submit"><b>Add
                                    Product</b></button>

                            <button id="updateBtn" class="btn btn-primary btn-block mt-3 d-none" type="button"><b>Update
                                    Product</b></button>

                        </form>

                    </div>
                </div>
            </div>
            <div class="col-8 offset-2">
                <table class="table table-hover table-bordered mt-5">
                    <thead class="text-center table-dark">
                        <tr>
                            <th>Sr.No</th>
                            <th>Product Name</th>
                            <th>Type</th>
                            <th>Stock</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>

                    <tbody id="tbody" class="text-center">
                        <!-- <tr>
                            <td>1</td>
                            <td>Laptop</td>
                            <td>Electronics</td>
                            <td>100</td>
                            <td> <i class="fa-solid fa-pen-to-square text-primary"></i> </td>
                            <td> <i class="fa-solid fa-trash text-danger"></i></td>
                        </tr> -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>

</body>

</html>
